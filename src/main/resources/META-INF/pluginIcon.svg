<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- commit graph: original commit (top) and extracted commit (bottom) -->
  <path d="M9 11v18" stroke="#6C707E" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="9" cy="10" r="4.5" fill="#3574F0"/>
  <circle cx="9" cy="30" r="4.5" fill="#E08855"/>
  <!-- lines kept in the original commit -->
  <rect x="17" y="6" width="19" height="3" rx="1.5" fill="#3574F0"/>
  <rect x="17" y="12" width="13" height="3" rx="1.5" fill="#3574F0"/>
  <!-- the split -->
  <path d="M16 20h21" stroke="#6C707E" stroke-width="1.5" stroke-dasharray="2.5 2" stroke-linecap="round"/>
  <!-- lines moved to the new commit -->
  <rect x="17" y="25" width="15" height="3" rx="1.5" fill="#E08855"/>
  <rect x="17" y="31" width="19" height="3" rx="1.5" fill="#E08855"/>
</svg>
